apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlops-model-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mlops-model-api
  template:
    metadata:
      labels:
        app: mlops-model-api
    spec:
      containers:
        - name: mlops-model-api
          image: mlops-model-api:latest
          ports:
            - containerPort: 8000

---
apiVersion: v1
kind: Service
metadata:
  name: mlops-model-api-service
spec:
  selector:
    app: mlops-model-api
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
  type: NodePort
